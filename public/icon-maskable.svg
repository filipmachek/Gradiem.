<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid single dark emerald background - pure flat #122820 -->
  <rect width="512" height="512" fill="#122820"/>

  <!-- Precisely centered GD text horizontally and vertically -->
  <text 
    x="256" 
    y="300" 
    text-anchor="middle" 
    font-family="'Playfair Display', 'Baskerville', 'Georgia', 'Times New Roman', serif" 
    font-size="175" 
    font-weight="700" 
    letter-spacing="2px" 
    fill="#FFFFFF"
  >GD</text>

  <!-- Checkmark exactly positioned under and to the right of D -->
  <path 
    d="M 370 315 L 396 352 L 452 260" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="17" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>
